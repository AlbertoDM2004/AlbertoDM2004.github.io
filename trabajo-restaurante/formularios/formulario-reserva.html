<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Alberto Díaz Miñana">
    <meta name="description" content="Página con formulario de reservas">
    <meta name="keywords" content="restaurante, los pacos, menú, platos, comida">
    <title>Formulario para las Reservas - Restaurante Los Pacos</title>
    <link rel="icon" type="image/png" href="img/logo.png">
</head>
<body>

<header>
    <h1>Formulario para las reservas</h1>
</header>

<nav>
    <a href="../../index.html">Volver a la página principal</a>
    <a href="../Restaurante.html">Volver a la carta</a>
</nav>

<main>
    <form action="#" method="post">
        <h2>Haz una reserva</h2>

        <p>
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" placeholder="Su nombre">
        </p>
        <p>
            <label for="clientes">Número de clientes:</label>
           <input type="number" id="clientes" placeholder="Número de clientes" min="1">
        </p>
        <p>
            <label for="correo">Correo electrónico:</label>
            <input type="email" id="correo" name="correo" placeholder="Su correo electrónico">
        </p>
        <p>
            <label for="telefono">Teléfono:</label>
            <input type="tel" id="telefono" name="telefono" placeholder="su teléfono">
        </p>
        <p>
            <label for="fecha">Fecha de la reserva:</label>
            <input type="date" id="fecha" name="fecha" placeholder="Fecha de la reserva">
        </p>
        <p>
            <label for="hora">Hora de la reserva:</label>
            <input type="time" id="hora" name="hora" placeholder="Hora de la reserva">
        </p>
        <p>
            <label for="mensaje">Mensaje:</label>
            <input type="text" id="mensaje" name="mensaje" placeholder="Su mensaje">
        </p>
        <p>
            <button type="submit">SOLICITAR RESERVA</button>
        </p>
        <p>
            <small>Si desea saber cómo protegemos sus datos, consulte nuestra <a href="#">Política de privacidad</a></small>
        </p>
    </form>

</main>

<footer>
    © 2026
</footer>

</body>
</html>
