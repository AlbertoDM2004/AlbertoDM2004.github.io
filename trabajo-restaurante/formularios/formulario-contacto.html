<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Alberto Díaz Miñana">
    <meta name="description" content="Página para formulario de contacto del restaurante">
    <meta name="keywords" content="restaurante, los pacos, menú, platos, comida">
    <title>Formulario de Contacto - Restaurante Los Pacos</title>
    <link rel="icon" type="image/png" href="../img/logo.png">
</head>
<body>

<header>
    <h1>Formulario de contacto</h1>
</header>

<nav>
    <a href="../../index.html">Volver a la página principal</a>
    <a href="../Restaurante.html">Volver a la carta</a>
</nav>

<main>
    <form action="#" method="post">
        <h2>Envíenos su mensaje</h2>
        <p>
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" placeholder="Su nombre">
        </p>
        <p>
            <label for="correo">Correo electrónico:</label>
            <input type="email" id="correo" name="correo" placeholder="Su correo electrónico">
        </p>
        <p>
            <label for="telefono">Teléfono:</label>
            <input type="tel" id="telefono" name="telefono" placeholder="Su teléfono">
        </p>
        <p>
            <label for="mensaje">Mensaje:</label><br>
            <textarea id="mensaje" name="mensaje" rows="6" cols="60" maxlength="500" placeholder="Su mensaje"></textarea>
        </p>
        <p>
            <small>0 / 500</small>
        </p>
        <p>
            <button type="submit">ENVIAR</button>
        </p>
    </form>

</main>

<footer>
    <p>2026 - Alberto Díaz - Restaurante Los Pacos.</p>
</footer>

</body>
</html>
